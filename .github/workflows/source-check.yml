name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify metadata and license files
        run: |
          node -e "const p=require('./packages/desktop/package.json'); if(p.name!=='zmarkdown'||p.license!=='AGPL-3.0-only')process.exit(1)"
          test -s LICENSE && test -s LICENSE-MIT && test -s NOTICE.md
